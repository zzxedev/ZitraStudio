<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ZitraDev — Admin Tickets</title>
<link rel="stylesheet" href="assets/styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script><script src="js/common.js"></script>
</head>
<body>
<header class="topbar"><div class="container nav">
<a class="brand" href="index.html"><span class="brandmark">ZX</span><span>ZitraDev<span class="red">.</span> Admin</span></a>
<div class="navActions"><a class="btn ghost" href="index.html">← Site client</a><button class="btn ghost hidden hideMobile" id="logoutBtn">Déconnexion</button></div>
</div></header>
<main class="section"><div class="container">
<div id="loginGate" class="panel pad authBox hidden"><div class="eyebrow">Administration</div><h2 style="margin:0 0 10px">Connexion admin</h2><p class="small muted">Utilise l'adresse e-mail inscrite dans la table <code>admins</code>.</p><form id="loginForm" class="formActions"><input id="loginEmail" type="email" required placeholder="admin@email.com"><button class="btn">Recevoir le lien</button></form><div id="loginMsg" class="notice ok"></div></div>
<div id="denied" class="panel pad authBox hidden"><h2>Accès refusé</h2><p class="small muted">Ce compte est connecté, mais il n'est pas administrateur.</p><button class="btn alt" id="deniedLogout">Changer de compte</button></div>
<div id="adminApp" class="hidden">
<div class="sectionHead"><div><div class="eyebrow">Dashboard</div><h2>Gestion des <span class="red">tickets.</span></h2></div><p id="adminEmail"></p></div>
<div class="stats">
<div class="stat"><span>Nouveaux</span><strong id="sNew">0</strong></div>
<div class="stat"><span>En cours</span><strong id="sProgress">0</strong></div>
<div class="stat"><span>Attente client</span><strong id="sWaiting">0</strong></div>
<div class="stat"><span>Terminés</span><strong id="sCompleted">0</strong></div>
<div class="stat"><span>Fermés</span><strong id="sClosed">0</strong></div>
</div>
<div class="panel pad">
<div class="filters"><input id="search" placeholder="Rechercher par ticket, client, projet ou service..."><select id="statusFilter"><option value="">Tous les statuts</option><option value="new">Nouveau</option><option value="in_progress">En cours</option><option value="waiting_client">En attente client</option><option value="completed">Terminé</option><option value="closed">Fermé</option></select></div>
<div id="ticketList" class="list"><div class="empty">Chargement...</div></div>
</div>
</div>
</div></main>
<script src="js/admin.js"></script>
</body></html>
